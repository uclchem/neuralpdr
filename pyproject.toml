[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralpdr"
version = "2024.9.6"
authors = [
  {name = "Gijs Vermariën", email = "vermarien@strw.leidenuniv.nl"}
]
maintainers = [
  {name = "Gijs Vermariën", email = "vermarien@strw.leidenuniv.nl"}
]
description = "A 3dpdr emulator"
readme = "README.rst"
license = {file = "LICENSE.txt"}
keywords = ["Astronomy", "Astrochemistry", "Surrogate model", "NeuralODE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]
requires-python = ">=3.10,<3.14" # for ray
dependencies = [
    "PyYAML",
    "chex",
    "diffrax",
    "equinox",
    "h5py",
    "jax",
    "jax",
    "jaxlib",
    "jaxtyping",
    "joblib",
    "matplotlib",
    "neptune",
    "numpy",
    "numpy",
    "opt-einsum",
    "optax",
    "orbax",
    "pandas",
    "pydantic",
    "pytest",
    "ray",
    "tomlkit",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
