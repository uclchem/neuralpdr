name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true  # Pull test datasets if using Git LFS
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify test datasets
      run: |
        ls -lh data/test/*.h5 || echo "Test datasets not found (tests will use full datasets if available)"
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short
      env:
        # Tests will automatically use minimal datasets from data/test/ if available
        PYTHONPATH: ${{ github.workspace }}/src
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          .pytest_cache/
          test-*.xml
        retention-days: 7
