name: Integration Tests (with datasets)

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      dataset_url:
        description: 'URL to download test datasets (optional)'
        required: false
        type: string

jobs:
  integration-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Download datasets (if URL provided)
      if: ${{ github.event.inputs.dataset_url != '' }}
      run: |
        mkdir -p data/processed
        wget -O datasets.tar.gz "${{ github.event.inputs.dataset_url }}"
        tar -xzf datasets.tar.gz -C data/processed/
        ls -lh data/processed/
    
    - name: Run all tests including integration tests
      run: |
        python -m pytest tests/ -v --tb=short
      env:
        PYTHONPATH: ${{ github.workspace }}/src
    
    - name: Generate test report
      if: always()
      run: |
        python -m pytest tests/ --tb=short --junit-xml=test-report.xml || true
    
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-report
        path: test-report.xml
        retention-days: 30
